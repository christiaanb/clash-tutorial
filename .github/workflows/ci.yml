name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The chapter code must compile. This is what makes the book's {{#include}}
  # blocks trustworthy: if a chapter's code stops building, the book breaks here
  # rather than in front of a reader.
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            code/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('code/stack.yaml', 'code/*.cabal') }}

      - name: Build all chapter modules
        working-directory: code
        run: stack build

      - name: Run doctests
        working-directory: code
        run: stack test

  # Generate VHDL for the final chapter's top entity and simulate the generated
  # test bench, exactly as chapter 10 instructs the reader to.
  simulate:
    runs-on: ubuntu-latest
    needs: code
    steps:
      - uses: actions/checkout@v4

      - name: Install NVC
        uses: nickg/setup-nvc@v1
        with:
          version: '1.20.1'

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            code/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('code/stack.yaml', 'code/*.cabal') }}

      - name: Generate VHDL
        working-directory: code
        run: stack run clash -- Chapters.Ch13 --vhdl

      # VERIFY (V3): the file list must match what Clash 1.10.0 actually emits,
      # in dependency order. This command is the one printed in chapter 10, so it
      # is tested here for the reader's benefit, not ours.
      - name: Analyse, elaborate and run
        working-directory: code
        run: |
          echo "VERIFY: replace with the explicit, ordered file list from V3"
          exit 1

  # The book must build, and every {{#include}} must resolve.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build
        run: mdbook build book

      # preview-book below cannot run for a pull request from a fork, and a job
      # that is skipped without a word reads as a bug. It is not one: a fork's
      # pull request gets a read-only token by design, so it cannot publish
      # anything. The build above still proves the book renders.
      - name: Say why a fork gets no preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "This pull request comes from a fork, so it gets no preview URL:" \
               "a fork's token cannot write to the gh-pages branch." \
               "Build \`mdbook build book\` locally to read it rendered." \
            >> "$GITHUB_STEP_SUMMARY"

  # Publish the rendered book to GitHub Pages. The book job above is the gate:
  # this only runs once every {{#include}} has resolved, so a broken anchor never
  # reaches a reader as a half-rendered page.
  #
  # The site is served from the gh-pages branch, which holds only rendered output:
  # this book at the root, and one preview per open pull request under pr/. That
  # second thing is why the branch is no longer force pushed as a single commit
  # (force_orphan) — replacing it wholesale would delete every open preview every
  # time a chapter merged — and why the push is a script in this repository rather
  # than an action: what gets deleted has become a decision worth reading. Pages
  # must be pointed at that branch once, by hand, in Settings -> Pages.
  #
  # Uses the built-in GITHUB_TOKEN, so unlike publish-template there is no secret
  # to install and no environment to enter.
  publish-book:
    runs-on: ubuntu-latest
    needs: book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Shared with preview-book and with the cleanup in pr-preview-cleanup.yml, so
    # that no two jobs push to gh-pages at once. The script survives losing that
    # race; this is what stops it having to.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      # Rebuilt rather than carried over from the book job as an artifact: the
      # build is seconds, and a job that builds what it publishes cannot publish
      # something other than what it built.
      - name: Build
        run: mdbook build book

      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/gh-pages-publish.sh book/book ''

  # A pull request is where a chapter is read before anyone else reads it, and
  # what is being judged is prose: how it reads rendered is most of the review.
  # This publishes the branch's book to pr/<number>/ on the same gh-pages branch
  # and puts the URL in the run's summary. pr-preview-cleanup.yml takes it down
  # again when the pull request closes.
  #
  # pull_request, not pull_request_target: the latter would hand a write token to
  # a workflow that checks out unreviewed content, and book.toml can name a
  # preprocessor command, which is to say arbitrary code run against the token
  # that publishes the site. The cost is that a fork's pull request gets no
  # preview, which the book job says out loud.
  preview-book:
    runs-on: ubuntu-latest
    needs: book
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      # book.toml sets site-url to /clash-tutorial/, which mdBook renders into
      # 404.html as the <base href> every other link on that page resolves
      # against. A preview is served one directory deeper, so left alone its 404
      # page would send the reader to main's site. mdBook reads any setting from
      # the environment, mapping __ to . and _ to -, so the one place site-url is
      # written stays book.toml.
      - name: Build
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /clash-tutorial/pr/${{ github.event.pull_request.number }}/
        run: mdbook build book

      - name: Publish the preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/gh-pages-publish.sh book/book "pr/${{ github.event.pull_request.number }}"

      - name: Link to the preview
        run: |
          echo "The rendered book for this pull request:" \
               "https://christiaanb.github.io/clash-tutorial/pr/${{ github.event.pull_request.number }}/" \
            >> "$GITHUB_STEP_SUMMARY"

  # Chapter 1's very first command depends on the template being reachable as
  # christiaanb/clash-tutorial, which means it must exist in a repository named
  # stack-templates. This job proves the template still produces a project that
  # builds; publish-template below is what gets it to the reader.
  template:
    runs-on: ubuntu-latest
    # Only so that code/ has written the cache this job reads. Jobs without a
    # needs: start together, and a cache entry is not written until its job's post
    # step runs, so without this the very first run on a new snapshot races code/
    # and misses.
    needs: code
    steps:
      - uses: actions/checkout@v4

      # Read-only: the smoke-test project uses the same resolver and extra-deps
      # as code/, so code/'s snapshot is exactly what it needs. Without this the
      # gate in front of publish-template is a fifteen minute Clash build.
      #
      # The path list must be character for character the one the code job saves
      # under, including code/.stack-work, which this job has no use for. A cache
      # entry is addressed by key *and* by a version hash taken over the paths and
      # the compression method, so asking for a subset of the paths misses on a
      # key that plainly exists — the failure this comment exists to prevent
      # someone re-introducing by tidying the unused path away.
      - name: Restore Stack cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.stack
            code/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('code/stack.yaml', 'code/*.cabal') }}

      # `stack test` as well as `stack build`, because V19 was a test suite that
      # had never compiled: `stack build` does not build test suites, so nothing
      # caught it.
      - name: Create a project from the local template
        run: |
          stack new ci-smoke-test ./template/clash-tutorial.hsfiles
          cd ci-smoke-test
          stack build
          stack test

  # template/clash-tutorial.hsfiles is the source of truth. Stack resolves the
  # shorthand `christiaanb/clash-tutorial` that chapter 1 tells the reader to type
  # to a repository literally named stack-templates, so the file has to exist
  # there too (D7). This job puts it there, so that editing the template in this
  # repository is an ordinary change rather than one the reader never receives
  # (D15).
  #
  # The mirror is a rendered copy, not a fork: a single-commit repository holding
  # only the .hsfiles, force pushed. That is safe only because the mirror holds
  # nothing else. It holds one file today; if it ever holds a second, this job
  # overwrites it.
  #
  # Needs the secret STACK_TEMPLATES_DEPLOY_KEY: the private half of a deploy key
  # with write access on christiaanb/stack-templates.
  publish-template:
    runs-on: ubuntu-latest
    environment: main
    needs: template
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Compared by git blob hash through the API rather than by fetching the raw
      # file, because raw.githubusercontent.com is CDN cached for minutes and a
      # stale answer here would skip a push that was needed.
      - name: Has the template changed
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          local_sha=$(git hash-object template/clash-tutorial.hsfiles)
          mirror_sha=$(gh api \
            repos/christiaanb/stack-templates/contents/clash-tutorial.hsfiles?ref=main \
            --jq .sha 2>/dev/null || echo none)
          echo "local $local_sha, mirror $mirror_sha"
          if [ "$local_sha" = "$mirror_sha" ]; then
            echo "The mirror is already current. Nothing to push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the deploy key
        if: steps.changed.outputs.push == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.STACK_TEMPLATES_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::The template changed but the secret STACK_TEMPLATES_DEPLOY_KEY is not set, so the mirror cannot be updated. Chapter 1's first command downloads from the mirror, so this is a reader-facing failure, not a CI detail. Add a deploy key with write access on christiaanb/stack-templates."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Force push the template to christiaanb/stack-templates
        if: steps.changed.outputs.push == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
        run: |
          rm -rf mirror
          mkdir mirror
          cp template/clash-tutorial.hsfiles mirror/
          cd mirror
          git init -b main
          git config user.name "clash-tutorial CI"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Automated push from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git remote add origin git@github.com:christiaanb/stack-templates.git
          git push --force origin main
          # Proves the push landed rather than trusting its exit code, and does it
          # against the git protocol rather than the CDN.
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"

      # The end-to-end check, and the only one that speaks for the reader: run
      # chapter 1's actual first command and compare the project it produces
      # against one made from this repository's copy. Comparing the two projects
      # rather than the two .hsfiles is deliberate: Stack stores its cached
      # download as a GitHub API response, so the cached file never matches the
      # repository's copy byte for byte even when the content is identical.
      - name: Check the reader gets what we pushed
        if: steps.changed.outputs.push == 'true'
        run: |
          rm -rf verify ~/.stack/templates
          mkdir -p verify/from-mirror verify/from-repo
          (cd verify/from-mirror && stack new life christiaanb/clash-tutorial)
          (cd verify/from-repo && stack new life "${GITHUB_WORKSPACE}/template/clash-tutorial.hsfiles")
          diff -r verify/from-mirror/life verify/from-repo/life
